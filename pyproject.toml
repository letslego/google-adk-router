[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-adk-router"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["google-adk>=2.11,<2.12", "python-dotenv>=1", "litellm>=1.80,<2", "PyYAML>=6,<7", "memorylayer-client==0.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dynamic_router*", "finance_common*", "finance_goal*", "finance_dynamic*", "finance_react*", "memory_layer*", "capability_registry*", "finance_registry*"]

[tool.setuptools.package-data]
dynamic_router = ["catalog/*.json", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
