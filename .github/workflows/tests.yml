name: Offline tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MEMORY_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
